[theme]
base = "light"
font = "sans-serif"
baseRadius = "12px"
buttonRadius = "999px"
showWidgetBorder = true

primaryColor = "#0F6E56"
backgroundColor = "#FAFDFC"
secondaryBackgroundColor = "#E8F2F0"
textColor = "#1A2E2A"
borderColor = "#D1E0DD"
linkColor = "#0F6E56"
